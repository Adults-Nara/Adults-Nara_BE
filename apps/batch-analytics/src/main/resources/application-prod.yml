spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

logging:
  level:
    com.ott: INFO
    org.springframework.batch: INFO
