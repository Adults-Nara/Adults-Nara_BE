spring:
  application:
    name: core-api

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/asn
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

  elasticsearch:
    uris: http://localhost:9200

server:
  port: 8080

jwt:
  secret: test-secret-key-for-local-development-only-do-not-use-in-production
  access-token-validity: 3600000
  refresh-token-validity: 604800000

kakao:
  client-id: test-kakao-client-id
  client-secret: test-kakao-client-secret
  redirect-uri: http://localhost:3000/oauth/callback/kakao

oauth:
  state-secret: test-state-secret

s3:
  bucket: asn-local-bucket

cloudfront:
  domain: d123456.cloudfront.net
  key-pair-id: test-key-pair-id
  private-key-pem-b64: test-private-key
